name: CI

on:
  pull_request:
    branches: [main, test-quality-sweep-baseline, 'harden-lint-*']

jobs:
  build-test:
    name: build-test (${{ matrix.lane-name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
            lane-name: "3.12"
          - python-version: "3.13"
            experimental: false
            lane-name: "3.13"
          - python-version: "3.14"
            experimental: false
            lane-name: "3.14"
          - python-version: "3.15"
            experimental: true
            lane-name: "3.15, allowed failure"
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "0"
      UV_PYTHON: ${{ matrix.python-version }}
      WHITAKER_INSTALLER_VERSION: '0.2.7'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}
      - name: Install rust
        uses: leynos/shared-actions/.github/actions/setup-rust@bf0f7fd98756a3643e9a3af70d0df7b7cf6d1fe7
      - name: Install pinned nightly rustfmt
        run: rustup toolchain install nightly-2026-05-28 --component rustfmt --profile minimal
      - name: Cache ~/.cargo and target/
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: python-${{ matrix.python-version }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ env.BUILD_PROFILE }}
          key: ${{ runner.os }}-cargo-${{ env.BUILD_PROFILE }}-${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.BUILD_PROFILE }}-${{ matrix.python-version }}-
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install tools
        run: uv tool install ty
      - name: Install lxml build dependencies (experimental)
        if: matrix.experimental
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-dev libxslt1-dev
      - name: Check format
        run: make check-fmt
      - name: Cache Whitaker installer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        run: |
          installed_version() {
            whitaker-installer --version 2>/dev/null | awk 'NR == 1 { print $2 }'
          }
          if [ "$(installed_version)" != "${WHITAKER_INSTALLER_VERSION}" ]; then
            if ! cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"; then
              echo "cargo-binstall failed; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}" --force
            fi
          fi
          if [ "$(installed_version)" != "${WHITAKER_INSTALLER_VERSION}" ]; then
            echo "Whitaker installer version does not match ${WHITAKER_INSTALLER_VERSION}"
            exit 1
          fi
          whitaker-installer
      - name: Lint
        run: make lint
      - name: Spelling
        run: make spelling
      - name: Typecheck
        run: make typecheck
      - name: Test Rust (no default features)
        run: cargo test --manifest-path rust_extension/Cargo.toml --no-default-features -- --test-threads=1
      - name: Test Rust (log-compat feature)
        run: cargo test --manifest-path rust_extension/Cargo.toml --no-default-features --features log-compat -- --test-threads=1
      - name: Test all-feature Rust documentation
        run: make test-doc
      - name: Verify Cargo packages
        run: make package-check
      - name: Test and measure coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@bf0f7fd98756a3643e9a3af70d0df7b7cf6d1fe7
        with:
          output-path: coverage.xml
          format: cobertura
          cargo-manifest: rust_extension/Cargo.toml
          with-default-features: false
          features: python,test-util
