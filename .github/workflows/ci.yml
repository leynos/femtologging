name: CI

on:
  pull_request:
    branches: [main, test-quality-sweep-baseline, 'harden-lint-*']

jobs:
  build-test:
    name: build-test (${{ matrix.lane-name }})
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. There is
    # no main-branch writer: this workflow runs on pull requests only, so each
    # pull request warms its own Ubicloud cache scope. standard-4, not
    # standard-2: on two vCPUs the first run spent 23 min in lint, 9 min in
    # typecheck and over 17 min in the Rust tests, and was cancelled at the
    # 55-minute ceiling (run 36596547457).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap, so the job states its own ceiling: twice the warm
    # standard-4 runs of up to 19 min (run 36617135055, attempts 2 and 3), rounded up
    # to 40.
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
            lane-name: "3.12"
          - python-version: "3.13"
            experimental: false
            lane-name: "3.13"
          - python-version: "3.14"
            experimental: false
            lane-name: "3.14"
          - python-version: "3.15"
            experimental: true
            lane-name: "3.15, allowed failure"
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "0"
      UV_PYTHON: ${{ matrix.python-version }}
      # Tool pins mirrored from the Makefile defaults; the contract test in
      # tests/test_lint_version_contract.py asserts the two stay in sync.
      RUFF_VERSION: '0.16.4'
      TY_VERSION: '0.0.75'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}
      - name: Install rust
        uses: leynos/shared-actions/.github/actions/setup-rust@ff1dd759dfffc0db3459e30e833f52437ee62b57
      - name: Cache ~/.cargo and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: python-${{ matrix.python-version }}
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ env.BUILD_PROFILE }}
          key: ${{ runner.os }}-cargo-${{ env.BUILD_PROFILE }}-${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.BUILD_PROFILE }}-${{ matrix.python-version }}-
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install makeutil
        id: makeutil
        # A digest-verified prebuilt release rather than a from-source build.
        uses: leynos/shared-actions/.github/actions/install-makeutil@ebe2f3105334283441f4c915eb979a0f4b9f2c04

      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'
      - name: Install lxml build dependencies (experimental)
        if: matrix.experimental
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-dev libxslt1-dev
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          version: "0.6.0"

      - name: Check format
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@6dea5677a84fec60ca51b07202570e3af12ffdb4
      - name: Lint
        run: make lint
      - name: Spelling
        run: make spelling
      - name: Typecheck
        run: make typecheck
      - name: Test Rust (no default features)
        run: cargo test --manifest-path rust_extension/Cargo.toml --no-default-features -- --test-threads=1
      - name: Test Rust (log-compat feature)
        run: cargo test --manifest-path rust_extension/Cargo.toml --no-default-features --features log-compat -- --test-threads=1
      - name: Cache uv
        # The caller owns this cache (generate-coverage is given
        # `cache-provider: external` below), because the action's own uv cache
        # is keyed on the operating system and the pyproject hash alone and
        # restores `environments-v2`, whose entries are bound to the
        # interpreter that built them. A warm restore of that state made the
        # action's `uv venv` exit 2 on Ubicloud (runs 36609525985 and
        # 36611613127; cold run 36604456094 passed). This key carries the
        # runner environment and the lane's Python version, and the
        # interpreter-bound directory is left out of the cached path.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            !~/.cache/uv/environments-v2
          key: uv-${{ runner.os }}-${{ runner.environment }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.environment }}-${{ matrix.python-version }}-
      - name: Test and measure coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@14c325b60788814cd50298eb8060228daee3b842
        with:
          # The Cache uv step above owns the uv cache; the Rust caches are the
          # Swatinem and cargo steps earlier in this job.
          cache-provider: external
          output-path: coverage.xml
          format: cobertura
          cargo-manifest: rust_extension/Cargo.toml
          with-default-features: false
          features: python,test-util
          # Serial pytest, as before generate-coverage grew pytest-workers:
          # the stack-info snapshot records pytest's own call stack, and
          # an xdist worker replaces it with execnet frames.
          pytest-workers: ''
