name: heavy-tests

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test'
        required: false
        default: ''

jobs:
  heavy:
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install pinned nightly rustfmt
        run: rustup toolchain install nightly-2026-05-28 --component rustfmt --profile minimal
      - name: Set up virtualenv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip

          # Cache wheels to avoid repeated downloads
          pip install \
            --cache-dir "${{ runner.tool_cache }}" \
            "maturin==1.13.3" pytest==8.4.2 pytest-bdd==8.1.0
      - name: Build editable extension
        run: |
          source .venv/bin/activate
          maturin develop --manifest-path rust_extension/Cargo.toml
      - name: Compile Loom heavy tests
        run: |
          RUSTFLAGS="--cfg loom" cargo test --manifest-path rust_extension/Cargo.toml \
            --no-default-features --test heavy --no-run
      - name: Run formatters and tests
        run: |
          source .venv/bin/activate
          # Keep the stable compiler for builds and tests; nightly is only used
          # for the repository's formatting profile.
          cargo +nightly-2026-05-28 fmt --manifest-path rust_extension/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust_extension/Cargo.toml -- -D warnings
          feature_sets=("" "python" "log-compat" "python,log-compat")
          for feature_set in "${feature_sets[@]}"; do
            if [ -z "$feature_set" ]; then
              cargo test --manifest-path rust_extension/Cargo.toml \
                --no-default-features -- --ignored
            else
              cargo test --manifest-path rust_extension/Cargo.toml \
                --no-default-features --features "$feature_set" -- --ignored
            fi
          done
          pytest -q
