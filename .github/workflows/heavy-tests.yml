name: heavy-tests

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test'
        required: false
        default: ''

jobs:
  heavy:
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '0'
      # Pinned Makefile parser used by the lint contract tests. The nightly
      # toolchain and Polonius flag are required to build Makeutil.
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil
      - name: Set up virtualenv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip

          # Cache wheels to avoid repeated downloads
          pip install \
            --cache-dir "${{ runner.tool_cache }}" \
            "maturin==1.13.3" pytest==9.1.1 pytest-bdd==8.1.0 \
            pytest-timeout pytest-xdist syrupy \
            "hypothesis>=6.135,<7" "pyyaml>=6.0.3,<7"
      - name: Build editable extension
        run: |
          source .venv/bin/activate
          maturin develop --manifest-path rust_extension/Cargo.toml
      # The Loom build lives in its own target directory and cache, apart from
      # the ordinary build's: `--cfg loom` changes every crate's fingerprint,
      # so sharing a directory would rebuild both on every run. The key names
      # the toolchain, the lockfile, the feature selection and the flags.
      - name: Read the Rust toolchain version
        id: toolchain
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the Loom build
        uses: actions/cache@v4
        with:
          path: target/loom
          key: loom-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('rust_extension/Cargo.lock') }}-no-default-features-cfg-loom-release
      - name: Compile Loom heavy tests
        env:
          CARGO_TARGET_DIR: target/loom
        run: |
          RUSTFLAGS="--cfg loom" cargo test --release --manifest-path rust_extension/Cargo.toml \
            --no-default-features --test heavy --no-run
      - name: Run formatters and tests
        run: |
          source .venv/bin/activate
          cargo fmt --manifest-path rust_extension/Cargo.toml -- --check
          make lint-rust-clippy
          RUSTFLAGS="--cfg loom" cargo clippy --manifest-path rust_extension/Cargo.toml \
            --no-default-features --all-targets -- -D warnings
          feature_sets=("" "python" "log-compat" "python,log-compat")
          for feature_set in "${feature_sets[@]}"; do
            if [ -z "$feature_set" ]; then
              cargo test --manifest-path rust_extension/Cargo.toml \
                --no-default-features -- --ignored
            else
              cargo test --manifest-path rust_extension/Cargo.toml \
                --no-default-features --features "$feature_set" -- --ignored
            fi
          done
          pytest -q
      # Executing the models is separate from compiling them, and the split is
      # the point: a green compile step says the models type-check and nothing
      # about the behaviour they describe. `--include-ignored` rather than
      # `--ignored`, because the latter runs only ignored tests.
      #
      # `scripts/run_loom_models.py` fails the step unless every model named in
      # `loom-models.txt` is reported as passed and nothing else is, so a run
      # that compiled the models out, filtered them away or skipped them cannot
      # report success. The build is `--release`, as Loom recommends: the
      # topology models take about eight minutes optimized and eleven not.
      #
      # This step is last, so a model failure never stops the heavy suite, the
      # Clippy lanes or pytest from reporting.
      - name: Run Loom models
        timeout-minutes: 45
        env:
          CARGO_TARGET_DIR: target/loom
          LOOM_MAX_PREEMPTIONS: '3'
        run: |
          RUSTFLAGS="--cfg loom" uv run --script scripts/run_loom_models.py \
            --expected rust_extension/tests/heavy/loom-models.txt -- \
            cargo test --release --manifest-path rust_extension/Cargo.toml \
            --no-default-features --test heavy loom_ -- --include-ignored
