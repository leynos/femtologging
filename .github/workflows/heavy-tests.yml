name: heavy-tests

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test'
        required: false
        default: ''

# The heavy job only checks the repository out, so it runs with a read-only
# token. `notify-failure` declares its own wider block.
permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '0'
      # Mirror the Makefile's uv configuration so any project build uv performs
      # carries the `test-util` feature that `FEMTOLOGGING_EXPECT_TEST_UTIL`
      # requires. Without it, a re-sync during `uv run` would install an
      # extension built without the feature and the test step would fail.
      UV_CONFIG_FILE: ${{ github.workspace }}/.github/uv-test-util.toml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        # setup-rust installs the toolchain rust-toolchain.toml pins and the
        # mold linker the build standard selects. `rustflags: ''` exports no
        # RUSTFLAGS: the Loom steps below assign their own, with the linker flag.
        uses: leynos/shared-actions/.github/actions/setup-rust@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          install-mold: 'true'
          rustflags: ''
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Install makeutil
        id: makeutil
        # A digest-verified prebuilt release rather than a from-source build.
        uses: leynos/shared-actions/.github/actions/install-makeutil@ab6505246c6b043b742a225e428e00448c0a37af

      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'
      - name: Install locked test dependencies
        # Install exactly what developers test: the dev group resolved in
        # uv.lock. An unpinned `pip install` let the runner resolve a newer
        # pluggy than the lock pins, and the stack_info snapshot recorded that
        # release's source text, which failed every scheduled run. Locked mode
        # also refuses a manifest the lock has not caught up with; `--frozen`
        # would install the stale lock silently.
        env:
          UV_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: uv sync --locked --group dev
      - name: Build editable extension
        run: |
          uv run --locked maturin develop --manifest-path rust_extension/Cargo.toml \
            --features python,test-util
      # The Loom build lives in its own target directory and cache, apart from
      # the ordinary build's: `--cfg loom` changes every crate's fingerprint,
      # so sharing a directory would rebuild both on every run. The key names
      # the toolchain, the lockfile, the feature selection and the flags.
      - name: Read the Rust toolchain version
        id: toolchain
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the Loom build
        uses: actions/cache@v6
        with:
          path: target/loom
          key: loom-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('rust_extension/Cargo.lock') }}-no-default-features-cfg-loom-release
      - name: Fetch locked dependencies
        # Before any step that runs tests, so a nested Cargo build in a test does not
        # resolve them while holding the shared package-cache lock (the Concordat
        # nested-cargo-offline-tests rule, NC-008).
        run: cargo fetch --locked --manifest-path rust_extension/Cargo.toml
      - name: Compile Loom heavy tests
        env:
          CARGO_TARGET_DIR: target/loom
        run: |
          RUSTFLAGS="--cfg loom -C link-arg=-fuse-ld=mold" cargo test --release --manifest-path rust_extension/Cargo.toml \
            --no-default-features --test heavy --no-run
      - name: Run formatters and tests
        env:
          FEMTOLOGGING_EXPECT_TEST_UTIL: "1"
        run: |
          cargo fmt --manifest-path rust_extension/Cargo.toml -- --check
          make lint-rust-clippy
          RUSTFLAGS="--cfg loom -C link-arg=-fuse-ld=mold" cargo clippy --manifest-path rust_extension/Cargo.toml \
            --no-default-features --all-targets -- -D warnings
          feature_sets=("" "python" "log-compat" "python,log-compat")
          for feature_set in "${feature_sets[@]}"; do
            if [ -z "$feature_set" ]; then
              cargo test --manifest-path rust_extension/Cargo.toml \
                --no-default-features -- --ignored
            else
              cargo test --manifest-path rust_extension/Cargo.toml \
                --no-default-features --features "$feature_set" -- --ignored
            fi
          done
          uv run --locked pytest -q
      # Executing the models is separate from compiling them, and the split is
      # the point: a green compile step says the models type-check and nothing
      # about the behaviour they describe. `--include-ignored` rather than
      # `--ignored`, because the latter runs only ignored tests.
      #
      # `scripts/run_loom_models.py` fails the step unless every model named in
      # `loom-models.txt` is reported as passed and nothing else is, so a run
      # that compiled the models out, filtered them away or skipped them cannot
      # report success. The build is `--release`, as Loom recommends: the
      # topology models take about eight minutes optimized and eleven not.
      #
      # `uv run --script` puts the interpreter the checker requires (3.13 or
      # newer) first on `PATH`, and PyO3 links whichever Python it finds there.
      # The heavy binary then loads `libpython3.14` from a runner that has only
      # 3.12 on the loader path and exits 127 before any model runs.
      # `PYO3_PYTHON` names the interpreter `setup-python` installed, so the
      # build links the library the loader can find.
      #
      # This step is last, so a model failure never stops the heavy suite, the
      # Clippy lanes or pytest from reporting.
      - name: Run Loom models
        timeout-minutes: 45
        env:
          CARGO_TARGET_DIR: target/loom
          LOOM_MAX_PREEMPTIONS: '3'
          PYO3_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          RUSTFLAGS="--cfg loom -C link-arg=-fuse-ld=mold" uv run --script scripts/run_loom_models.py \
            --expected rust_extension/tests/heavy/loom-models.txt -- \
            cargo test --release --manifest-path rust_extension/Cargo.toml \
            --no-default-features --test heavy loom_ -- --include-ignored

  # A red nightly runs at 17:00 and, before this job existed, said nothing to
  # anyone: the stack_info snapshot broke on 15 October 2026 and the Loom
  # models did not execute for a month. Only scheduled runs notify, so a
  # manual dispatch used to verify a fix does not open or comment on the
  # tracking issue. The issue is found by its exact title rather than a label,
  # because a label is a second thing to create and keep.
  notify-failure:
    name: Record the failed nightly run
    needs: heavy
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: heavy-tests nightly failure
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_SHA: ${{ github.sha }}
    steps:
      - name: Comment on or open the nightly failure issue
        shell: bash
        run: |
          set -euo pipefail
          # The `github` context has no run-start timestamp, so ask the API for
          # the run's creation time; a blank session date is worse than none.
          run_date="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json createdAt --jq .createdAt)"
          # Narrow to title matches on the server first. `--limit` bounds the
          # fetched results, not the filtered ones, so listing every open issue
          # and filtering locally would open a duplicate once the tracking issue
          # fell past the limit. The exact-title check still decides the match.
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$ISSUE_TITLE\"" --limit 100 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')"
          body="$(printf '%s\n' \
            "The scheduled \`heavy-tests\` workflow failed." \
            "" \
            "- Run: $RUN_URL" \
            "- Commit: \`$RUN_SHA\`" \
            "- Date: $run_date")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" --body "$body"
          fi
