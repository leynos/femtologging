name: Coverage (main)

# Main owns both persistent coverage outputs: the ratchet baseline and the
# CodeScene upload. Pull requests generate coverage only for their own ratchet
# check, in ci.yml; they neither publish a report nor contact CodeScene.
#
# Measurement runs once per required Python lane, because the baseline cache
# key carries the interpreter's major.minor. A lane whose baseline was never
# published restores nothing and compares against zero, so its ratchet can
# never fail; publishing all three is what makes each of them a real gate. The
# experimental lane in ci.yml publishes nothing, because a failure there must
# not gate the trunk.
#
# The measurement runs on a GitHub-hosted runner because it blocks nobody's
# work; each baseline is published from an Ubicloud job because the pull
# request lanes run there and a cache written on one runner provider is not
# read by the other. `publish-baseline: never` keeps the measuring job out of
# the cache store entirely and hands its figures to the publisher through a
# workflow artefact.
#
# A fork or Dependabot pull request cannot obtain an Ubicloud runner, so
# `ci.yml` falls back to the hosted pool for it, and that lane restores from
# GitHub's cache store instead. `coverage-baseline-hosted` publishes the same
# hand-overs there; without it a hosted lane would restore nothing, start its
# baseline at zero and never fail. Both publishers ratchet the same figure and
# each writes only the store its own runner provider serves.
#
# A failed lane must not withdraw a successful sibling's publication.
# Measurement uses `fail-fast: false`, so every other lane still finishes; each
# publisher also runs after the matrix whenever the run was not cancelled, and
# a lane publishes only when its own hand-over artefact is present. A missing
# hand-over while every lane succeeded stays a failure, because that is a lost
# publication rather than a lane that measured nothing.
#
# The CodeScene upload is a job of its own, downstream of the measurement
# alone: a CodeScene outage must not stop the baseline advancing, because the
# ratchet is the trunk's regression gate and the report is not. The upload job
# still fails when CodeScene refuses the report, and so fails the workflow. It
# checks out the measured commit, because the uploader attributes the report to
# a branch and commit from the clone it runs in, not from the report alone. A
# failure in a lane other than 3.14 still publishes the trunk's report: only
# that lane produces it, and only its absence prevents the upload.
#
# Known exception: a Dependabot pull request merged by dependabot-automerge
# with GITHUB_TOKEN fires no push event, so that merge publishes nothing until
# the next push to main.

on:
  push:
    branches: [main]

# One group per ref, never cancelled. A cancelled publisher abandons both its
# upload and its baseline write, so cancellation is off and the group
# serialises active runs: one run publishes at a time. Which of several waiting
# pushes holds the pending slot follows when each run started waiting, not push
# time, so this setting does not order uploads by commit and cannot make the
# newest baseline win. A manual "Re-run jobs" on an older run is an operator
# action: it keeps that run's commit and republishes its coverage to CodeScene.
# It cannot rewrite a baseline already saved, because a cache entry is
# immutable once written, so a rerun's save is a no-op and a baseline a later
# push superseded stays superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  coverage-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # Each lane publishes its own interpreter-keyed baseline, so one lane's
      # failure must not withdraw the other two.
      fail-fast: false
      matrix:
        # The required lanes of ci.yml, in that order. 3.15 is experimental
        # there, so a baseline for it would gate the trunk on an allowed
        # failure.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # The baseline key carries the resolved interpreter's major.minor. The
      # action takes it from `python-version` below; this keeps every other uv
      # invocation in the lane on the same interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
      FEMTOLOGGING_EXPECT_TEST_UTIL: "1"
      UV_CONFIG_FILE: ${{ github.workspace }}/.github/uv-test-util.toml
      # One of the two exclusions from the build standard: a coverage build is
      # a measurement, so it takes neither the parallel frontend nor the mold
      # linker. Assigning RUSTFLAGS displaces every `rustflags` table in
      # .cargo/config.toml. The linker is still installed below, because the
      # suite itself may reach Make's build-tool preflight.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, so the checkout token need not persist in
          # the clone's config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install rust
        # A hosted job that runs the suite installs the pinned toolchain and
        # linker, as `ci.yml`'s build-test does: the build-tool preflight may be
        # reached from a suite step, so the tools must be there. The coverage
        # build itself does not use the linker: the RUSTFLAGS assignment above
        # displaces the repository's rustflags, so no `-fuse-ld=mold` reaches
        # the compiler.
        uses: leynos/shared-actions/.github/actions/setup-rust@ff1dd759dfffc0db3459e30e833f52437ee62b57
        with:
          install-mold: 'true'
          # One cache lane per interpreter. On a push to main the action saves
          # its sccache directory under a key carrying this discriminator, and
          # the default is the job id, which all three lanes here share: they
          # would race to save one entry. The action expects a caller to make a
          # matrix lane distinct, so it is named here.
          sccache-cache-discriminator: ${{ matrix.python-version }}
          # One writer for the Cargo registry archive; every other lane only
          # restores it. The three lanes compile the same code, so a single
          # owner loses nothing and the archive is saved once.
          save-cache: ${{ matrix.python-version == '3.14' }}
      - name: Install makeutil
        id: makeutil
        # The measured suite includes the contract tests, which parse the
        # Makefile through `makeutil`. Without it those tests fail with a
        # missing executable instead of a contract complaint, so the lane is
        # measured at all only once the parser is there.
        uses: leynos/shared-actions/.github/actions/install-makeutil@ebe2f3105334283441f4c915eb979a0f4b9f2c04
      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'
      # Every input that defines what is measured must match ci.yml's coverage
      # step field for field, or the baseline this job writes describes a
      # different population from the one pull requests ratchet against.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@203eedc136c14c28041e92c06a929383807b3a3f
        with:
          output-path: coverage.xml
          format: cobertura
          cargo-manifest: rust_extension/Cargo.toml
          with-default-features: false
          features: python,test-util
          pytest-workers: ''
          # Names the interpreter whose major.minor keys this lane's baseline,
          # so the figure published below is the one this lane's pull requests
          # restore.
          python-version: ${{ matrix.python-version }}
          with-ratchet: 'true'
          # This runner's cache store is not the one the Ubicloud pull-request
          # lanes read, so a ratchet here could never fail and a save here
          # would never be restored. `never` skips both and hands the figures
          # to `coverage-baseline`, which publishes from an Ubicloud runner.
          publish-baseline: never
          # The action's own archive would store this report a second time;
          # the hand-over below and the explicit `codescene-report` upload are
          # the only copies this workflow keeps.
          publish-artefact: 'false'
          baseline-artefact-name: coverage-baseline-handover-${{ matrix.python-version }}
      - name: Keep the report for the uploader
        # The upload job holds the CodeScene environment and nothing else, so
        # the report it sends must reach it as an artefact. Only the newest
        # required lane's report is kept: the three lanes measure the same
        # population, and CodeScene analyses one report per commit.
        if: ${{ matrix.python-version == '3.14' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codescene-report
          path: coverage.xml
          # Long enough to retry a failed upload job over a weekend. A retry
          # after this window finds the report gone, so it must re-run the
          # measurement rather than only the upload job.
          retention-days: 3
          if-no-files-found: error

  coverage-upload:
    needs: coverage-measure
    # Measurement keeps running its other lanes after a failure, but a failed
    # dependency would still skip this job even when 3.14 produced the report.
    # `!cancelled()` is the one condition that runs after a failed dependency.
    # A missing report then fails the fetch below, so no upload happens.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone. No pull-request-reachable job may declare it, so a
    # change on a branch can never read the token; the workflow contracts hold
    # that split.
    environment: codescene
    # The uploader attributes the report to a branch and commit by reading the
    # clone it runs in, so this job needs the measured revision, though it
    # compiles and tests nothing.
    permissions:
      contents: read
    steps:
      - name: Check out the measured commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The measurement checked out this commit; the upload must describe
          # the same revision, not whatever the default ref resolves to.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch the measured report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codescene-report
          path: ${{ runner.temp }}/coverage-report
      # Whether the token is set, as a plain step output. The expression is
      # evaluated before the shell runs, so this step binds nothing: the token
      # sits in no `env` in this workflow, because the upload action is
      # composite and hands its step's `env` to the nested steps it runs.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # The push trigger is already restricted to main; the ref conjunct keeps
      # the upload confined there if a dispatch trigger is ever added. A
      # missing token skips the upload without failing the job, and the
      # baseline still publishes: a token cannot hide a coverage regression.
      - name: Upload coverage data to CodeScene
        if: ${{ steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main' }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@203eedc136c14c28041e92c06a929383807b3a3f
        with:
          path: ${{ runner.temp }}/coverage-report/coverage.xml
          format: cobertura
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

  # Both publishers ratchet the same hand-over and each writes the cache store
  # its own runner provider serves. Two jobs rather than one, because a cache
  # written on one provider is not read by the other: the Ubicloud lanes
  # restore from the first store, and a fork or Dependabot pull request, which
  # ci.yml places on the hosted pool, restores from the second.
  coverage-baseline:
    needs: coverage-measure
    # A failed sibling lane would otherwise skip this whole matrix. The probe
    # below decides which lanes have a figure to publish.
    if: ${{ !cancelled() }}
    # The pull-request lanes run on Ubicloud, and they restore the baseline
    # from the cache store they can read, so this job runs there too and
    # compiles nothing. A push has no pull request, so both halves of the
    # condition are empty and the expression selects Ubicloud; the hosted arm
    # exists because the placement contract reads this shape as the estate's
    # fallback rule, not because this push-only workflow can reach it.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # Each lane publishes its own key, and one lane's ratchet failure must
      # not withdraw the others.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for this lane's hand-over
        id: handover
        # Only a partial failure needs the probe. When every lane succeeded, a
        # lost hand-over must fail the publisher, so the action's own download
        # stays unguarded and reports it. Under a partial failure, an absent
        # hand-over is this lane's own failure, and this lane publishes
        # nothing.
        if: ${{ needs.coverage-measure.result != 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-baseline-handover-${{ matrix.python-version }}
          path: ${{ runner.temp }}/coverage-handover-probe
      - name: Publish the ratchet baseline
        if: ${{ needs.coverage-measure.result == 'success' || steps.handover.outcome == 'success' }}
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@203eedc136c14c28041e92c06a929383807b3a3f
        with:
          artefact-name: coverage-baseline-handover-${{ matrix.python-version }}

  coverage-baseline-hosted:
    needs: coverage-measure
    # The same figures, ratcheted again for GitHub's cache store, which is what
    # a fork or Dependabot pull request restores from. Without this publisher
    # that lane would restore nothing, start its baseline at zero, and never
    # fail.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for this lane's hand-over
        id: handover
        if: ${{ needs.coverage-measure.result != 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-baseline-handover-${{ matrix.python-version }}
          path: ${{ runner.temp }}/coverage-handover-probe
      - name: Publish the ratchet baseline
        if: ${{ needs.coverage-measure.result == 'success' || steps.handover.outcome == 'success' }}
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@203eedc136c14c28041e92c06a929383807b3a3f
        with:
          artefact-name: coverage-baseline-handover-${{ matrix.python-version }}