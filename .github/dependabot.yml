version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    groups:
      shared-actions:
        patterns:
          - 'leynos/shared-actions*'
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Enable version updates for Cargo
  - package-ecosystem: "cargo"
    directory: "/rust_extension"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Enable version updates for Python (uv-managed pyproject.toml and uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # pytest-bdd is pinned to 8.1.0 beside pytest 9.1.1 (docs/developers-guide.md),
    # and a pytest-bdd release has to be checked against the pytest it supports
    # before the pair moves (see leynos/cuprum#384), so it is bumped by hand.
    ignore:
      - dependency-name: "pytest-bdd"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
