# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = ["OT", "astroid", "mis", "yse"]

[words.corrections]

[patterns]
# Inline code spans quote identifiers and deliberate spelling examples;
# they are code, not prose, so the en-GB-oxendict rules do not apply.
# The allowlist covers exactly the CSS option names this project uses. The
# shared dictionary's broad colour-option mask is withdrawn below, because it
# would hide a misspelt colour word anywhere in the repository.
ignore = [
    "(?:^|[^A-Za-z0-9_-])(?:--color-primary|--tw-color-red-500)(?:$|[^A-Za-z0-9_-])",
    "rust-analyzer",
    "`[^`\\n]+`",
]
remove = ['--[A-Za-z0-9_-]*color(?:ed|s|ing|ize[ds]?|izing)?(?:\b|_)']

[files]
exclude = ["rust_extension/target"]
