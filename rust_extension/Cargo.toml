[package]
name = "femtologging_rs"
version = "0.1.0"
edition = "2024"
authors = ["Payton McIntosh <pmcintosh@df12.net>"]

[lib]
name = "_femtologging_rs"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
delegate = "0.13.4"
pyo3 = { version = "0.29.0", default-features = false, features = ["macros", "auto-initialize", "multiple-pymethods"] }
crossbeam-channel = "0.5.15"
log = "0.4"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
once_cell = "1"
parking_lot = "0.12"
thiserror = "2"
tempfile = "^3.20.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
native-tls = { version = "0.2", features = ["vendored"] }
rand = "0.8"
encoding_rs = "0.8"
ini = { package = "rust-ini", version = "0.21.3" }
ureq = { version = "2.9", features = ["native-tls"] }
percent-encoding = "2.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
default = ["extension-module", "python", "log-compat", "tracing-compat"]
extension-module = ["python", "pyo3/extension-module"]
python = []
test-util = []
log-compat = ["python"]
tracing-compat = ["python", "tracing", "tracing-subscriber"]

[dev-dependencies]
femtologging_test_macros = { workspace = true }
criterion = "0.8"
rstest = "0.26"
logtest = "2.0"
proptest = "1.0.0"
loom = "0.7.2"
itertools = "0.15"
serial_test = "3"
_femtologging_rs = { path = ".", package = "femtologging_rs", default-features = false, features = ["test-util"] }
static_assertions = "1"
filetime = "0.2"
trybuild = { version = "1", features = ["diff"] }

[workspace]
members = ["test_macros"]
resolver = "3"

[workspace.dependencies]
# Cargo omits this private development dependency from published packages.
femtologging_test_macros = { path = "test_macros" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes                    = "deny"
allow_attributes_without_reason     = "deny"
blanket_clippy_restriction_lints    = "deny"
cognitive_complexity                = "deny"
disallowed_methods                  = "deny"
needless_pass_by_value              = "deny"
implicit_hasher                     = "deny"
missing_assert_message              = "deny"

# 2. debugging leftovers
dbg_macro                           = "deny"
print_stdout                        = "deny"
print_stderr                        = "deny"

# 2. panic-prone operations
unwrap_used                         = "deny"
expect_used                         = "deny"
indexing_slicing                    = "deny"
string_slice                        = "deny"
integer_division                    = "deny"
integer_division_remainder_used     = "deny"
panic_in_result_fn                  = "deny"
unreachable                         = "deny"

# 4. portability
host_endian_bytes                   = "deny"
little_endian_bytes                 = "deny"
big_endian_bytes                    = "deny"

# 5. nursery idiom polish
let_underscore_must_use             = "deny"
or_fun_call                         = "deny"
option_if_let_else                  = "deny"
self_named_module_files             = "deny"
shadow_reuse                        = "deny"
shadow_same                         = "deny"
shadow_unrelated                    = "deny"
str_to_string                       = "deny"
string_lit_as_bytes                 = "deny"
try_err                             = "deny"
unneeded_field_pattern              = "deny"
use_self                            = "deny"

# 6. numerical foot-guns
float_arithmetic                    = "deny"
cast_possible_truncation            = "deny"
cast_possible_wrap                  = "deny"
cast_precision_loss                 = "deny"
lossy_float_literal                 = "deny"

# 7. API ergonomics
missing_const_for_fn                = "deny"
must_use_candidate                  = "deny"
unused_async                        = "deny"

# 8. Error handling
missing_panics_doc                  = "deny"
error_impl_error                    = "deny"
result_large_err                    = "deny"

[workspace.lints.rust]
unknown_lints                       = "deny"
renamed_and_removed_lints           = "deny"
unsafe_code                         = "forbid"
missing_docs                        = "deny"

# The existing Loom test configuration remains recognized.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.rustdoc]
missing_crate_level_docs            = "deny"
broken_intra_doc_links              = "deny"
private_intra_doc_links             = "deny"
bare_urls                           = "deny"
invalid_html_tags                   = "deny"
invalid_codeblock_attributes        = "deny"
unescaped_backticks                 = "deny"
